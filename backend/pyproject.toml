[project]
name = "app"
version = "0.1.0"
description = "The backend part of the project that is responsible for turning the user input into duration and notes"
readme = "README.md"
authors = [
    { name = "Kingsley Leon", email = "kingsleyl.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "pretty-midi>=0.2.11.post0",
    "pydantic>=2.13.5",
    "flask>=3.1.3",
    "python-dotenv>=1.2.3",
    "numpy>=2.5.3",
    "music21>=10.5.0",
    "accompanist",
    "librosa>=1.0.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.1.0",
    "psycopg[binary]>=3.3.6",
    "python-jose[cryptography]>=3.5.0",
    "flask-cors>=6.0.5",
    "elevenlabs>=2.69.0",
    "google-genai>=2.25.0",
    "basic-pitch>=0.4.0",
    "onnxruntime>=1.20",
    "setuptools<81",
    "av>=14",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
app = "app:main"

[tool.vercel]
# Vercel serves the Flask app named `app` in backend/wsgi.py (it calls create_app()).
entrypoint = "wsgi:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# Test-only tools: `uv sync` installs them locally, but they stay out of the Vercel bundle.
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv.workspace]
members = [
    "accompanist",
]

[tool.uv.sources]
accompanist = { workspace = true, editable = true }

[tool.uv]
# basic-pitch (audio intake: hum → notes) asks for an old TensorFlow that has no Python 3.14 builds.
# It runs its ONNX model with onnxruntime instead, so its TensorFlow and CoreML requirements are left out.
exclude-dependencies = ["tensorflow", "tensorflow-macos", "coremltools"]
