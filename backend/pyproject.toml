[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kingsley Leon", email = "kingsleyleoncs@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "mido>=1.3.3",
    "pretty-midi>=0.2.11.post0",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
