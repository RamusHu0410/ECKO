[project]
name = "app"
version = "0.1.0"
description = "The backend part of the project that is responsible for turning the user input into duration and notes"
readme = "README.md"
authors = [
    { name = "Kingsley Leon", email = "kingsleyl.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "mido>=1.3.3",
    "pretty-midi>=0.2.11.post0",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
    "flask>=3.1.3",
    "python-dotenv>=1.2.3",
    "numpy>=2.5.3",
    "music21>=10.5.0",
    "accompanist",
    "librosa>=1.0.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = [
    "accompanist",
]

[tool.uv.sources]
accompanist = { workspace = true, editable = true }
