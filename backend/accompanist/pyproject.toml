[project]
name = "accompanist"
version = "0.1.0"
description = "AI accompanist backend"
requires-python = ">=3.10"
dependencies = [
    "music21>=8.3.0",
    "pretty-midi>=0.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["accompanist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
